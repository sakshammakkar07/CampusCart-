<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f32">
  <meta name="description" content="CampusCart — the student-powered marketplace for campus life.">
  <title>CampusCart — Made for campus life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="announcement"><span class="announcement-dot"></span> A better way to buy, sell & share on campus <button data-page="explore">Explore the marketplace <span aria-hidden="true">→</span></button></div>
  <header class="site-header">
    <a class="brand" href="#" data-page="home" aria-label="CampusCart home">
      <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 16.5 20 8l12 8.5v13a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 8 29.5v-13Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 31V20h10v11M13.5 16.5h13M20 11v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="12" r="2" fill="currentColor"/></svg></span>
      <span class="brand-name">campus<span>cart</span><small>YOUR CAMPUS. YOUR MARKET.</small></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-link active" data-page="home">Home</button>
      <button class="nav-link" data-page="explore">Explore</button>
      <button class="nav-link" data-page="rentals">Rentals</button>
      <button class="nav-link" data-page="assistant">AI assistant <span class="nav-spark">✦</span></button>
    </nav>
    <div class="header-actions">
      <button class="icon-button wishlist-nav" data-page="wishlist" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.8 4.8 0 0 1 12 6.5a4.8 4.8 0 0 1 8.8 2.3Z"/></svg><span class="badge-count" id="wishlist-count">0</span></button>
      <button class="button button-outline header-sell" data-page="sell">＋ Sell an item</button>
      <button class="avatar-button" data-page="dashboard" aria-label="Open dashboard">S</button>
      <button class="mobile-menu" id="mobile-menu" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <main id="app" class="app-main" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="footer-top"><a class="brand brand-footer" href="#" data-page="home"><span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 16.5 20 8l12 8.5v13a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 8 29.5v-13Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M15 31V20h10v11M13.5 16.5h13M20 11v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-name">campus<span>cart</span><small>YOUR CAMPUS. YOUR MARKET.</small></span></a><p>Good finds. Great campus energy.</p><div class="footer-links"><button data-page="explore">Marketplace</button><button data-page="sell">Sell an item</button><button data-page="assistant">Get help</button><button data-page="admin">Admin demo</button></div></div>
    <div class="footer-bottom"><span>© 2025 CampusCart. Built for student life.</span><span>Made with care, on campus <span class="footer-heart">♥</span></span></div>
  </footer>
  <section class="floating-chat" aria-label="CampusCart chat">
    <div class="floating-chat-panel" id="floating-chat-panel" role="dialog" aria-labelledby="floating-chat-title" aria-modal="false" hidden>
      <div class="chat-header">
        <span class="bot-avatar" aria-hidden="true">✦</span>
        <div class="floating-chat-heading"><strong id="floating-chat-title">Ask CampusCart</strong><small id="floating-chat-status">Local listing search · AI service not configured</small></div>
        <button class="floating-chat-close" id="floating-chat-close" type="button" aria-label="Close chat">×</button>
      </div>
      <div class="chat-messages floating-chat-messages" id="floating-chat-messages" aria-live="polite" aria-relevant="additions text"></div>
      <form class="chat-form floating-chat-form" id="floating-chat-form">
        <input id="floating-chat-input" type="text" placeholder="Ask about campus listings..." autocomplete="off" aria-label="Message CampusCart" required>
        <button class="button button-primary" type="submit">Send <span aria-hidden="true">↗</span></button>
      </form>
    </div>
    <button class="floating-chat-launcher" id="floating-chat-launcher" type="button" aria-controls="floating-chat-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/><path d="M8 11h8M8 14h5"/></svg>
      <span>Ask CampusCart</span>
    </button>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="script.js"></script>
</body>
</html>
